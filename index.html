<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          maximum-scale=1.0,
          user-scalable=no">

    <title>NOVUS | KRUSS Makers</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="welcome-screen">

        <!-- HEADER -->
        <header class="header">

            <h1>NOVUS</h1>

            <div class="creator">
                BY KRUSS MAKERS
            </div>

            <h2>
                YOUR AI MUSEUM GUIDE
            </h2>

        </header>


        <!-- ROBOT VIDEO -->
        <section class="robot-area">

            <video
                id="sleepVideo"
                autoplay
                muted
                loop
                playsinline>

                <source
                    src="media/novus-sleep.mp4"
                    type="video/mp4">

            </video>

            <div class="sleep-text">
                NOVUS IS SLEEPING...
            </div>

        </section>


        <!-- START BUTTON -->
        <section class="start-area">

            <button
                id="startButton"
                class="start-button">

                TOUCH HERE TO BEGIN TOUR

            </button>

        </section>


        <!-- FOOTER -->
        <footer>
            Interactive Museum Experience
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
