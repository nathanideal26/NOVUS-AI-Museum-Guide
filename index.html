<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          maximum-scale=1.0,
          user-scalable=no">

    <title>NOVUS | KRUSS Makers</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="welcome-screen">

        <header class="header">

            <h1>NOVUS</h1>

            <p class="byline">
                BY KRUSS MAKERS
            </p>

            <h2>
                YOUR AI MUSEUM GUIDE
            </h2>

        </header>

        <section class="video-wrapper">

            <video
                id="sleepVideo"
                autoplay
                muted
                loop
                playsinline
                preload="auto">

                <source
                    src="media/sleepmode.mp4"
                    type="video/mp4">

                Your browser does not support video.
            </video>

            <div class="video-overlay"></div>

            <div class="sleep-status">
                <span class="status-dot"></span>
                NOVUS IS IN SLEEP MODE
            </div>

        </section>

        <section class="button-area">

            <button
                id="beginTourButton"
                class="begin-button">

                <span class="touch-icon">✦</span>

                TOUCH HERE TO BEGIN TOUR

            </button>

            <p class="instruction">
                Tap the screen to wake NOVUS
            </p>

        </section>

        <footer>
            SMART • INTERACTIVE • AUTONOMOUS
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
